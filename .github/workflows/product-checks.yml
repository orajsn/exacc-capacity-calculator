name: Product checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install browser test tools
        run: |
          python -m venv "$RUNNER_TEMP/planner-qa"
          "$RUNNER_TEMP/planner-qa/bin/pip" install playwright==1.55.0
      - name: Exercise generic desktop and phone workflows
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/planner-http.log" 2>&1 &
          "$RUNNER_TEMP/planner-qa/bin/python" qa/browser_smoke.py
